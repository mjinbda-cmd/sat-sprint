<script>
(function(){
const DOMAINS = {
  "info-ideas":"Information & Ideas", "craft":"Craft & Structure",
  "expression":"Expression of Ideas", "conventions":"Standard English Conventions",
  "algebra":"Algebra", "advanced":"Advanced Math",
  "data":"Problem-Solving & Data Analysis", "geo":"Geometry & Trigonometry"
};
const RW = ["info-ideas","craft","expression","conventions"];
const DIFFNAME = {1:"Easy",2:"Medium",3:"Hard"};
const Q = [
/* ---- INFORMATION & IDEAS (19) ---- */
{id:"ii-01",sec:"rw",dom:"info-ideas",diff:1,
 passage:"The axolotl, a salamander native to lakes near Mexico City, keeps its juvenile features for its entire life, never undergoing the metamorphosis typical of amphibians. This trait, called neoteny, also accompanies a remarkable ability: the axolotl can regrow lost limbs, organs, and even portions of its brain.",
 stem:"Which choice best states the main idea of the text?",
 ch:["The axolotl is endangered in its native habitat.","The axolotl's retention of juvenile traits accompanies an unusual regenerative ability.","Most amphibians undergo metamorphosis as they mature.","The axolotl is found only in lakes near Mexico City."],
 a:1,exp:"The passage centers on neoteny and the regeneration that comes with it, so the choice combining both ideas states the main point. Endangerment is never mentioned; the other two options are supporting details, not the main idea."},
{id:"ii-02",sec:"rw",dom:"info-ideas",diff:1,
 passage:"Honeybees communicate the location of food through a 'waggle dance.' The angle of the dance relative to vertical indicates direction, while the duration of the waggle phase indicates distance. Other bees in the hive read these signals and fly directly to the source.",
 stem:"According to the text, what does the duration of the waggle phase communicate?",
 ch:["The direction of the food source","The distance to the food source","The type of flower discovered","The number of bees needed"],
 a:1,exp:"The text states directly that duration indicates distance, while the angle indicates direction. Flower type and bee count are never mentioned."},
{id:"ii-03",sec:"rw",dom:"info-ideas",diff:1,
 stem:"A researcher measured plant growth under three light colors and found that plants under blue light reached 30 cm, those under red light 20 cm, and those under green light 15 cm.\n\nWhich finding best supports the claim that blue light most promotes vertical growth?",
 ch:["Plants under green light grew the least of the three.","Plants under blue light reached 30 cm, exceeding red (20 cm) and green (15 cm).","Red light produced taller plants than blue light.","All three groups grew to roughly the same height."],
 a:1,exp:"Supporting 'blue light most promotes vertical growth' requires data showing blue produced the tallest plants, which the comparison of 30 cm to 20 cm and 15 cm does. One option is factually false, and the other two never address blue light's relative performance."},
{id:"ii-04",sec:"rw",dom:"info-ideas",diff:1,
 passage:"Public libraries in the United States lend far more than books. Most now offer laptops, Wi-Fi hotspots, museum passes, and even tools and musical instruments. Circulation of these nontraditional items has grown every year since 2015.",
 stem:"Which choice best states the main idea of the text?",
 ch:["Libraries should stop lending books.","American libraries increasingly lend a wide range of nontraditional items.","Museum passes are the most popular library item.","Library funding has declined since 2015."],
 a:1,exp:"Every sentence develops the idea that libraries lend more than books and that this lending is growing. Nothing in the text supports the claims about stopping book lending, museum-pass popularity rankings, or funding."},
{id:"ii-05",sec:"rw",dom:"info-ideas",diff:1,
 stem:"Early critics dismissed the painter's loose brushwork as evidence of carelessness. Yet close inspection reveals that each apparently hasty stroke was placed with deliberate precision, building forms that cohere only when viewed from a distance. The technique was therefore not a failure of skill but ______\n\nWhich choice most logically completes the text?",
 ch:["a sign of her inexperience.","a calculated artistic strategy.","an accident of cheap materials.","a rejection of all tradition."],
 a:1,exp:"'Deliberate precision' plus the structure 'not a failure of skill but ___' signals an intentional, positive contrast, which only the idea of a calculated strategy provides. The other options all contradict 'deliberate precision.'"},
{id:"ii-06",sec:"rw",dom:"info-ideas",diff:1,
 passage:"A 2023 survey of 1,200 commuters found that those who cycled to work reported higher morning alertness than those who drove, even after researchers controlled for sleep duration and caffeine intake.",
 stem:"Based on the text, what can be concluded about the alertness difference?",
 ch:["It is fully explained by cyclists sleeping longer.","It persisted even when sleep and caffeine were accounted for.","It disappeared once caffeine was considered.","It applied only to commuters over 40."],
 a:1,exp:"'Controlled for sleep duration and caffeine intake' means the difference remained after those factors were accounted for. The text says nothing about age, and the other options reverse what controlling for a variable means."},
{id:"ii-07",sec:"rw",dom:"info-ideas",diff:2,
 passage:"Historians long assumed that the medieval spice trade was driven mainly by the need to mask the taste of spoiled meat. But spices were luxury goods, affordable only to households wealthy enough to buy fresh meat whenever they wished. Surviving account books show spice purchases concentrated among the aristocracy, alongside fresh game and imported wine.",
 stem:"The account books serve mainly to ______",
 ch:["prove that spices were inexpensive in the medieval period.","support the challenge to the spoiled-meat explanation.","show that the aristocracy avoided fresh meat.","explain how spices were transported to Europe."],
 a:1,exp:"The books show spices bought by people who also bought fresh food, undercutting the idea that spices masked spoilage. That evidence supports the author's challenge to the old assumption. The text calls spices luxury goods, and transport is never discussed."},
{id:"ii-08",sec:"rw",dom:"info-ideas",diff:2,
 passage:"Text 1: Urban beekeeping has surged, celebrated as a way to support pollinators.\n\nText 2: Ecologist Rana Osei notes that honeybee hives can outcompete wild native bees for limited urban forage, and argues that planting diverse flowers helps pollinators more than adding hives does.",
 stem:"How would Osei (Text 2) most likely respond to the celebration described in Text 1?",
 ch:["By agreeing that more hives are the best way to help pollinators","By cautioning that added hives may harm wild bees and suggesting planting as an alternative","By denying that cities can support any pollinators","By proposing that wild bees be relocated to rural areas"],
 a:1,exp:"Osei's point is that hives can crowd out wild bees and that planting flowers helps more, so she would temper the celebration with that caution. She never denies cities can support pollinators or mentions relocation, and she directly disputes that more hives are best."},
{id:"ii-09",sec:"rw",dom:"info-ideas",diff:2,
 passage:"In a study of memory, participants who read a story aloud recalled 34% more details one week later than participants who read the same story silently. The researchers propose that the act of producing speech creates an additional memory trace.",
 stem:"Which finding, if true, would most directly weaken the researchers' proposal?",
 ch:["Participants who silently mouthed the words recalled as much as those who read aloud, despite producing no speech.","Participants who read aloud also enjoyed the story more.","A different story produced similar results.","Participants tested after two weeks recalled fewer details overall."],
 a:0,exp:"If mouthing without producing speech yields the same benefit, then speech production itself cannot be the cause, which undercuts the proposal. The other findings concern enjoyment, replication, or general forgetting and leave the causal claim intact."},
{id:"ii-10",sec:"rw",dom:"info-ideas",diff:2,
 passage:"The Antikythera mechanism, a geared device recovered from a Roman-era shipwreck, could predict eclipses and model planetary motion. Nothing of comparable mechanical complexity appears in the archaeological record for over a thousand years afterward.",
 stem:"Which choice best describes what the text implies about ancient technology?",
 ch:["Roman engineers routinely built such devices.","The mechanism represents a level of sophistication not seen again for centuries.","Eclipse prediction was impossible before modern times.","The device was likely a modern forgery."],
 a:1,exp:"The gap of a thousand years in the record implies the device's sophistication was exceptional and long unmatched. 'Nothing comparable' rules out routine production, the device itself disproves the impossibility claim, and forgery is never suggested."},
{id:"ii-11",sec:"rw",dom:"info-ideas",diff:2,
 stem:"A city doubled the frequency of one bus route while leaving others unchanged. Over six months, ridership on the improved route rose 42%, while ridership on unchanged routes rose 3%.\n\nWhich conclusion do the data best support?",
 ch:["Bus ridership always rises when fares fall.","The frequency increase was associated with a large ridership gain relative to other routes.","The unchanged routes lost most of their riders.","Riders switched from cars on every route."],
 a:1,exp:"Comparing 42% growth on the improved route with 3% elsewhere links the frequency change to the outsized gain. Fares are never mentioned, the unchanged routes grew slightly rather than losing riders, and the data say nothing about car switching."},
{id:"ii-12",sec:"rw",dom:"info-ideas",diff:2,
 passage:"Novelist Zora Neale Hurston trained as an anthropologist under Franz Boas, conducting fieldwork on folklore in the American South and the Caribbean. Scholars have argued that this training shaped her fiction: her novels record dialect, ritual, and oral storytelling with an ethnographer's ear.",
 stem:"Which detail from Hurston's novels, if present, would best support the scholars' argument?",
 ch:["Plots set in imaginary future societies","Careful transcription of regional speech patterns in dialogue","Characters who never speak","Chapters written entirely in formal academic prose"],
 a:1,exp:"The argument is that anthropological training gave her an ethnographer's ear for dialect and oral culture, so faithful transcription of regional speech is direct evidence. Futuristic settings, silent characters, and academic prose do not show ethnographic attention to spoken culture."},
{id:"ii-13",sec:"rw",dom:"info-ideas",diff:2,
 passage:"Glass frogs sleep on leaves with much of their blood withdrawn into the liver, rendering their bodies nearly transparent. When active at night, the blood recirculates and the frogs become more visible to predators.",
 stem:"It can most reasonably be inferred that the frogs' transparency functions primarily as ______",
 ch:["a way to attract mates during the day.","camouflage while the frogs are inactive and vulnerable.","a method of regulating body temperature.","a signal of territorial dominance."],
 a:1,exp:"Transparency occurs during sleep, when the frogs cannot flee, and visibility returns when they are active; the pattern points to concealment during vulnerability. Mating, temperature, and territory are never discussed."},
{id:"ii-14",sec:"rw",dom:"info-ideas",diff:3,
 passage:"Economist Amara Fielding examined 40 cities that adopted congestion pricing. Average traffic delays fell 18%, but the reduction varied widely: cities with robust transit saw delays fall up to 30%, while cities without it saw little change. Fielding concludes that congestion pricing succeeds only as a complement to existing alternatives.",
 stem:"Which choice best describes the function of the data about transit in Fielding's argument?",
 ch:["It shows that congestion pricing raises transit ridership.","It identifies the condition that explains when pricing works, grounding her conclusion.","It proves that transit alone eliminates traffic delays.","It demonstrates that all 40 cities benefited equally."],
 a:1,exp:"The transit split explains the variation in results and directly supports her claim that pricing works only alongside alternatives. The data describe delay reductions rather than ridership, no claim about transit alone is made, and the variation contradicts equal benefit."},
{id:"ii-15",sec:"rw",dom:"info-ideas",diff:3,
 passage:"Text 1: Paleontologists traditionally classified Tyrannosaurus rex specimens as a single species, attributing size differences to age and sex.\n\nText 2: A 2022 analysis proposed splitting T. rex into three species based on femur proportions and tooth counts. Critics responded that the traits vary continuously across specimens rather than clustering into groups, the pattern expected within one species.",
 stem:"Based on the texts, the critics in Text 2 would most likely say the traditional classification is ______",
 ch:["refuted by the femur data.","consistent with the continuous variation they observe.","based on too few specimens to evaluate.","valid only for juvenile specimens."],
 a:1,exp:"The critics argue the traits vary continuously, the signature of a single species, which is exactly what the traditional view holds. Their point defends rather than refutes that view, and neither specimen counts nor juveniles are raised as objections."},
{id:"ii-16",sec:"rw",dom:"info-ideas",diff:3,
 passage:"A trial gave one group of schools free breakfast for all students regardless of income, while comparison schools kept income-based eligibility. Universal-breakfast schools saw participation rise from 40% to 71% among eligible low-income students, the group already entitled to free breakfast under the old rules.",
 stem:"Which choice best explains why the participation increase among already-eligible students is significant?",
 ch:["It shows the program mainly benefited wealthy students.","It suggests that removing the income label reduced a barrier, such as stigma, that had deterred entitled students.","It proves that breakfast improves test scores.","It indicates that eligibility rules were previously enforced too strictly."],
 a:1,exp:"These students could already eat free, so cost was not the barrier; participation jumped only when the income-based distinction disappeared, pointing to something like stigma. Test scores are never measured, and the data concern uptake by low-income students, not benefits to the wealthy or enforcement of rules."},
{id:"ii-17",sec:"rw",dom:"info-ideas",diff:3,
 passage:"Astronomers detected phosphine in Venus's atmosphere, a gas produced on Earth mainly by microbes. Some hailed the finding as possible evidence of life. Follow-up studies, however, found the original signal may have been an artifact of data processing, and that sulfur dioxide, common on Venus, can mimic phosphine's spectral signature.",
 stem:"The follow-up studies function in the text to ______",
 ch:["confirm that microbes exist on Venus.","offer alternative explanations that weaken the original interpretation of the signal.","show that phosphine cannot exist anywhere but Earth.","prove the original astronomers fabricated data."],
 a:1,exp:"The follow-ups supply two rival explanations, a processing artifact and sulfur dioxide mimicry, which weaken the life interpretation without proving anything about microbes, phosphine's cosmic distribution, or misconduct."},
{id:"ii-18",sec:"rw",dom:"info-ideas",diff:3,
 stem:"Researchers claim a new alloy resists corrosion better than steel in marine environments. In tests, alloy samples submerged in seawater for 12 months showed 0.02 mm of surface loss, versus 0.31 mm for steel. However, the alloy samples were replaced with fresh ones every 3 months.\n\nWhich choice identifies the most serious flaw in using these tests to support the claim?",
 ch:["Seawater is not a marine environment.","The alloy samples' exposure was not comparable, since each was submerged for only a quarter of the test period.","Twelve months is too long for any corrosion test.","Steel should have been replaced more often than the alloy."],
 a:1,exp:"Replacing alloy samples every 3 months means no alloy sample endured the full 12 months that the steel did, so the comparison is invalid. Seawater is by definition marine, test length itself is not the problem, and replacing steel more often would worsen the imbalance rather than fix it."},
{id:"ii-19",sec:"rw",dom:"info-ideas",diff:3,
 passage:"Poet Gwendolyn Brooks revised her early formal style after 1967, adopting freer verse and direct address. Some critics framed the shift as a break with craft. Brooks disagreed, describing the change as a redirection of craft toward a new audience: she was, she said, writing to be heard 'in taverns and on street corners,' not just in classrooms.",
 stem:"Based on the text, Brooks would most likely view her post-1967 poems as ______",
 ch:["evidence that she had abandoned technical skill.","works requiring as much craft as her earlier poetry, deployed for a different audience.","imitations of her classroom-oriented early work.","poems written without any intended audience."],
 a:1,exp:"Brooks calls the shift 'a redirection of craft toward a new audience,' which asserts continuing skill aimed at new listeners. She explicitly rejects the abandonment framing, and the tavern remark names a specific intended audience rather than none."},
/* ---- CRAFT & STRUCTURE (19) ---- */
{id:"cs-01",sec:"rw",dom:"craft",diff:1,
 stem:"The senator's remarks were studiously ______: she avoided committing to either side of the debate, leaving listeners unsure of her real position.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["forthright","noncommittal","hostile","enthusiastic"],
 a:1,exp:"'Avoided committing to either side' defines the blank, and 'noncommittal' means exactly that. 'Forthright' is the opposite, and the other two words describe attitudes the text never suggests."},
{id:"cs-02",sec:"rw",dom:"craft",diff:1,
 stem:"Far from being ______, the new policy drew sharp criticism from groups across the political spectrum.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["controversial","uncontroversial","expensive","recent"],
 a:1,exp:"'Far from being X, the policy drew sharp criticism' means the policy actually was controversial, so the blank must be the opposite: 'uncontroversial.'"},
{id:"cs-03",sec:"rw",dom:"craft",diff:1,
 passage:"Many of the region's nineteenth-century structures remain in active use. For instance, the city's oldest bridge, built in 1823, still carries daily traffic.",
 stem:"Which choice best describes the function of the second sentence?",
 ch:["It introduces a counterargument to the first sentence.","It offers a specific example that illustrates the first sentence's claim.","It defines a technical term used in the first sentence.","It questions the accuracy of the first sentence."],
 a:1,exp:"'For instance' plus a concrete case, the 1823 bridge, makes the second sentence an illustrating example of the general claim. It neither opposes, defines, nor doubts the first sentence."},
{id:"cs-04",sec:"rw",dom:"craft",diff:1,
 stem:"The mountain guide's directions were so ______ that even first-time hikers reached the summit without a single wrong turn.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["ambiguous","precise","lengthy","optional"],
 a:1,exp:"Hikers making no wrong turns points to directions that were exact and clear, which 'precise' captures. 'Ambiguous' would produce the opposite result, and length or optionality would not guarantee accuracy."},
{id:"cs-05",sec:"rw",dom:"craft",diff:1,
 passage:"The volcano had been dormant for four centuries. Then, in the spring of 1902, tremors began.",
 stem:"Which choice best describes the function of the second sentence in relation to the first?",
 ch:["It signals a change from the long-standing condition described in the first sentence.","It explains why the volcano became dormant.","It provides a scientific definition of dormancy.","It repeats the information in the first sentence."],
 a:0,exp:"'Then' marks a turn: after centuries of quiet, activity begins. The sentence introduces change rather than explaining, defining, or repeating the dormancy."},
{id:"cs-06",sec:"rw",dom:"craft",diff:1,
 stem:"Because the museum's collection had grown too large for its original building, the trustees voted to ______ a new wing.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["demolish","commission","criticize","conceal"],
 a:1,exp:"A collection that has outgrown its building calls for added space, so the trustees would arrange to have a new wing built, which is what 'commission' means. Demolishing, criticizing, or concealing a wing would not solve the space problem."},
{id:"cs-07",sec:"rw",dom:"craft",diff:2,
 stem:"The biologist's field notes were remarkably ______: alongside standard measurements she recorded weather, soil texture, insect sounds, and even the smell of the underbrush.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["comprehensive","careless","brief","repetitive"],
 a:0,exp:"The list of many varied details recorded beyond the standard measurements signals thoroughness, which 'comprehensive' expresses. Such detail is the opposite of careless or brief, and the items are varied rather than repetitive."},
{id:"cs-08",sec:"rw",dom:"craft",diff:2,
 passage:"Some architects treat historic preservation as an obstacle to innovation. Chen's firm suggests otherwise. Her renovation of the Merchant Exchange keeps the 1830s facade intact while suspending a glass atrium within the original walls, a design that won awards for both preservation and innovation.",
 stem:"Which choice best describes the overall structure of the text?",
 ch:["A view is presented, and a counterexample is offered to challenge it.","Two identical opinions are compared.","A problem is described and left unresolved.","A chronological history of architecture is given."],
 a:0,exp:"The text opens with a general view, that preservation blocks innovation, then presents Chen's award-winning project as a case that contradicts it. The two views differ, the tension is answered rather than left open, and no chronological history appears."},
{id:"cs-09",sec:"rw",dom:"craft",diff:2,
 stem:"Though the treaty was hailed as a breakthrough, its provisions were largely ______: nearly every clause restated commitments the parties had already made in earlier agreements.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["novel","redundant","binding","secret"],
 a:1,exp:"Clauses that restate existing commitments add nothing new, making them 'redundant.' 'Novel' is contradicted by the colon explanation, and the text addresses repetition, not enforceability or secrecy."},
{id:"cs-10",sec:"rw",dom:"craft",diff:2,
 passage:"Text 1: Food historian Marta Ruiz argues that the tomato transformed Italian cooking almost immediately after its arrival from the Americas in the 1500s.\n\nText 2: Records show Italians largely treated tomatoes as ornamental plants for nearly two centuries; the first known Italian tomato recipes date to the 1690s.",
 stem:"How does Text 2 relate to the claim in Text 1?",
 ch:["It supports the claim with additional recipes.","It challenges the claim by suggesting the transformation was long delayed.","It restates the claim in stronger terms.","It shifts the discussion to a different vegetable."],
 a:1,exp:"Two centuries of ornamental use and recipes appearing only in the 1690s contradict 'almost immediately,' so the records challenge the timing in the first claim rather than support, restate, or change the subject."},
{id:"cs-11",sec:"rw",dom:"craft",diff:2,
 passage:"The narrator of the novel's first chapter describes her grandmother's kitchen in exhaustive detail: the chipped blue teapot, the smell of cardamom, the radio always tuned to the news. Only at the chapter's end does she reveal that the house burned down twenty years ago and she is describing it entirely from memory.",
 stem:"Which choice best describes the effect of withholding the final revelation until the end of the chapter?",
 ch:["It makes the earlier details feel like a preserved memorial once their source in memory is revealed.","It proves the narrator is lying about her grandmother.","It shifts the novel into a scientific register.","It confirms the kitchen still exists unchanged."],
 a:0,exp:"Learning that the vivid details survive only in memory recasts the whole description as an act of preservation. The revelation concerns loss, not deception, and it directly contradicts the idea that the kitchen still exists; nothing turns scientific."},
{id:"cs-12",sec:"rw",dom:"craft",diff:2,
 stem:"Critics who expected the memoir to settle old scores found it instead surprisingly ______: the author extends sympathy even to the rivals who once tried to end her career.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["vindictive","magnanimous","tedious","incoherent"],
 a:1,exp:"Extending sympathy to former rivals is generosity toward those who wronged her, the meaning of 'magnanimous.' 'Vindictive' is what critics expected and the sentence reverses that expectation; the other options concern style rather than attitude."},
{id:"cs-13",sec:"rw",dom:"craft",diff:2,
 passage:"In her lab reports, Dr. Ferreira never wrote 'the experiment failed.' She wrote 'the experiment returned an unexpected result,' a phrasing her students initially mocked and later adopted.",
 stem:"The contrast between the two phrasings mainly serves to ______",
 ch:["show that Ferreira's experiments never succeeded.","highlight a deliberate attitude toward setbacks that proved influential.","demonstrate that students always mock their teachers.","suggest that lab reports should avoid all description."],
 a:1,exp:"The reframed phrasing treats setbacks as information, and the students' shift from mocking to adopting shows the attitude's influence. The text describes wording, not a record of failure, and the other options overgeneralize."},
{id:"cs-14",sec:"rw",dom:"craft",diff:3,
 stem:"The philosopher's prose style was deceptively ______: sentences that read like casual conversation turned out, on rereading, to be constructed with an almost legal exactness.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["ornate","artless","convoluted","pedantic"],
 a:1,exp:"'Deceptively' signals that the apparent quality masks its opposite: the prose seems casual and unstudied, meaning 'artless,' while actually being exact. 'Ornate,' 'convoluted,' and 'pedantic' describe visibly elaborate or fussy styles, which would leave nothing deceptive to uncover on rereading."},
{id:"cs-15",sec:"rw",dom:"craft",diff:3,
 passage:"Text 1: Literary scholar James Obi contends that the sonnet form is exhausted, arguing that its 14-line structure can no longer surprise readers after eight centuries of use.\n\nText 2: Poet Danez Okafor's recent collection uses the sonnet's rigid frame ironically, setting mundane subjects like parking tickets inside the form's grand architecture, a tension reviewers called 'the freshest use of the form in decades.'",
 stem:"How would the reviewers quoted in Text 2 most likely respond to Obi's contention?",
 ch:["By agreeing that no sonnet can surprise modern readers","By suggesting that the form's very rigidity can still generate surprise when played against unexpected content","By arguing that sonnets should be longer than 14 lines","By claiming that parking tickets are unsuitable subjects for poetry"],
 a:1,exp:"The reviewers praise work that gets freshness precisely from the collision of rigid form and mundane content, so they would counter that the old structure can still surprise. Their praise contradicts agreement with exhaustion, and nobody proposes changing the form's length or restricting subjects."},
{id:"cs-16",sec:"rw",dom:"craft",diff:3,
 passage:"The report's authors are careful to distinguish correlation from causation, yet their word choices repeatedly blur the line they claim to draw: warming 'drives' migration, drought 'forces' relocation, heat 'compels' abandonment of farmland.",
 stem:"The quoted verbs mainly serve to ______",
 ch:["illustrate a tension between the authors' stated caution and their causal language.","prove that climate change causes migration.","show the authors avoided causal claims entirely.","provide statistical evidence for the report's findings."],
 a:0,exp:"The verbs 'drives,' 'forces,' and 'compels' assert causation, which clashes with the authors' stated care about correlation versus causation; the quotes exhibit that tension. They are word choices, not statistics, and they demonstrate the presence of causal language, not its absence or its truth."},
{id:"cs-17",sec:"rw",dom:"craft",diff:3,
 stem:"Reviewers praised the translation not for smoothing the original's difficulties but for ______ them: where the source text is jagged and abrupt, the English is jagged and abrupt too.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["resolving","preserving","exaggerating","ignoring"],
 a:1,exp:"The colon explains the blank: the translation keeps the original's jaggedness intact, which is preservation. 'Resolving' repeats the smoothing idea the sentence rejects, and nothing suggests the difficulties were amplified or overlooked."},
{id:"cs-18",sec:"rw",dom:"craft",diff:3,
 passage:"The documentary opens with a long, unbroken shot of the empty factory floor, the camera moving past silent machines at walking pace. No narration is offered for six full minutes. Only then does a former worker's voice begin: 'There were three thousand of us.'",
 stem:"Which choice best describes how the opening constructs its effect?",
 ch:["The prolonged silence and emptiness accumulate weight, so the first spoken line lands with the force of contrast.","The rapid editing creates excitement before the interview begins.","The narration explains the images as they appear.","The factory is shown at its busiest to establish context."],
 a:0,exp:"Six minutes of slow movement through silence and emptiness set up the voice's arrival, and 'three thousand of us' gains force against the vacancy just shown. The shot is unbroken rather than rapidly edited, narration is withheld rather than simultaneous, and the factory is empty, not busy."},
{id:"cs-19",sec:"rw",dom:"craft",diff:3,
 stem:"Her argument was less refuted than ______: rather than engaging its claims, opponents simply stopped citing the paper, and within a decade it had vanished from the field's debates.\n\nWhich choice completes the text with the most logical and precise word?",
 ch:["celebrated","abandoned","strengthened","plagiarized"],
 a:1,exp:"'Less refuted than ___' calls for what actually happened instead of refutation: opponents quietly dropped the paper until it disappeared from debate, which is abandonment. Celebration and strengthening contradict the vanishing, and plagiarism would involve using the work, not ignoring it."},
/* ---- EXPRESSION OF IDEAS (19) ---- */
{id:"ex-01",sec:"rw",dom:"expression",diff:1,
 stem:"The new filtration system removed nearly all particulate matter from the plant's exhaust. ______ air quality in the surrounding neighborhood improved markedly within months.\n\nWhich choice completes the text with the most logical transition?",
 ch:["However,","As a result,","For example,","In contrast,"],
 a:1,exp:"Cleaner exhaust causes better air quality, a cause-and-effect relationship that 'As a result' expresses. The two contrast words signal opposition that is not present, and the second sentence is a consequence, not an example."},
{id:"ex-02",sec:"rw",dom:"expression",diff:1,
 stem:"The committee expected the proposal to face strong opposition. ______ it passed with nearly unanimous support.\n\nWhich choice completes the text with the most logical transition?",
 ch:["Therefore,","Instead,","Similarly,","For instance,"],
 a:1,exp:"The expectation of opposition is reversed by the near-unanimous outcome, and 'Instead' marks exactly that reversal. 'Therefore' and 'Similarly' imply the outcome matched the expectation."},
{id:"ex-03",sec:"rw",dom:"expression",diff:1,
 stem:"Sea otters wrap themselves in kelp before sleeping. ______ they avoid drifting away on ocean currents during the night.\n\nWhich choice completes the text with the most logical transition?",
 ch:["Nevertheless,","In this way,","On the contrary,","Meanwhile,"],
 a:1,exp:"The second sentence describes the purpose achieved by the kelp-wrapping, so 'In this way' links method to result. The other transitions signal contradiction or simultaneity, neither of which fits."},
{id:"ex-04",sec:"rw",dom:"expression",diff:1,
 passage:"Notes the student has gathered:\n• The monarch butterfly migrates up to 3,000 miles.\n• It travels from Canada to central Mexico.\n• The full journey takes multiple generations.\n• No single butterfly completes the round trip.",
 stem:"The student wants to emphasize the multigenerational nature of the migration. Which choice best uses the notes to accomplish this goal?",
 ch:["The monarch butterfly migrates up to 3,000 miles from Canada to Mexico.","Because no single monarch completes the round trip, the 3,000-mile migration is carried out across multiple generations.","The monarch butterfly travels from Canada to central Mexico each year.","The monarch butterfly's journey can cover up to 3,000 miles."],
 a:1,exp:"The goal is to stress that the trip spans generations, and only one option foregrounds that idea. The others state distance or route but never mention generations."},
{id:"ex-05",sec:"rw",dom:"expression",diff:1,
 passage:"Notes the student has gathered:\n• The Sahara was grassland 6,000 years ago.\n• Cave paintings there show giraffes, hippos, and swimmers.\n• The region dried out as Earth's orbit shifted rainfall patterns.",
 stem:"The student wants to explain why the Sahara changed. Which choice best uses the notes to accomplish this goal?",
 ch:["Cave paintings in the Sahara show giraffes and swimmers.","The Sahara dried into desert when a shift in Earth's orbit altered rainfall patterns.","The Sahara was once a grassland with hippos.","Ancient artists painted animals on Saharan cave walls."],
 a:1,exp:"Explaining why the region changed requires the cause, the orbital shift that altered rainfall, which only one option provides. The others describe the past landscape or the paintings without giving a reason for the change."},
{id:"ex-06",sec:"rw",dom:"expression",diff:1,
 stem:"Photosynthesis requires sunlight, water, and carbon dioxide. ______ deep-sea ecosystems rely on chemical energy from hydrothermal vents rather than light.\n\nWhich choice completes the text with the most logical transition?",
 ch:["By contrast,","As a result,","In other words,","Specifically,"],
 a:0,exp:"Surface photosynthesis using light versus deep-sea life using vent chemistry is a direct opposition, which 'By contrast' signals. The second sentence is not a consequence, restatement, or elaboration of the first."},
{id:"ex-07",sec:"rw",dom:"expression",diff:2,
 stem:"Ravens can plan for future events, a skill once thought unique to humans and great apes. ______ in one experiment, ravens selected and stored tools they would need to open a puzzle box the following day.\n\nWhich choice completes the text with the most logical transition?",
 ch:["Nonetheless,","For example,","In contrast,","Consequently,"],
 a:1,exp:"The experiment is a specific instance of the planning ability just described, so 'For example' fits. The sentence illustrates the claim rather than opposing it or following from it as an effect."},
{id:"ex-08",sec:"rw",dom:"expression",diff:2,
 stem:"The city's first subway line opened in 1904 to immediate acclaim. ______ construction had claimed dozens of workers' lives, a cost rarely mentioned in the celebratory coverage.\n\nWhich choice completes the text with the most logical transition?",
 ch:["Similarly,","However,","Thus,","For instance,"],
 a:1,exp:"Acclaim set against unacknowledged deaths is a contrast, which 'However' marks. The deaths are neither similar to the acclaim, caused by it, nor an example of it."},
{id:"ex-09",sec:"rw",dom:"expression",diff:2,
 passage:"Notes the student has gathered:\n• Marie Maynard Daly earned a chemistry PhD in 1947, the first Black American woman to do so.\n• She researched the effects of cholesterol on the heart.\n• Her work helped link diet to cardiovascular disease.\n• She created scholarship funds for minority science students.",
 stem:"The student wants to emphasize the lasting scientific impact of Daly's research. Which choice best uses the notes to accomplish this goal?",
 ch:["Daly, who earned her PhD in 1947, created scholarships for minority students.","Daly's research on cholesterol helped establish the link between diet and cardiovascular disease, a foundation of modern heart medicine.","Daly was the first Black American woman to earn a chemistry PhD.","Daly worked on several research topics during her long career."],
 a:1,exp:"Emphasizing lasting scientific impact means naming the research and its enduring consequence, the diet-heart link. The other options highlight her degree, her scholarships, or vague breadth, not the research legacy."},
{id:"ex-10",sec:"rw",dom:"expression",diff:2,
 stem:"Some coral species survive marine heat waves by hosting heat-tolerant algae. ______ scientists are testing whether transplanting such algae into vulnerable reefs could improve their odds.\n\nWhich choice completes the text with the most logical transition?",
 ch:["Accordingly,","Regardless,","In contrast,","Previously,"],
 a:0,exp:"The research follows logically from the observation: because tolerant algae help some corals, scientists are testing transplants. 'Accordingly' expresses that inference; the other choices break the logical connection."},
{id:"ex-11",sec:"rw",dom:"expression",diff:2,
 passage:"Notes the student has gathered:\n• The Bermuda Triangle's disappearance rate is proportionally no higher than other heavily trafficked ocean regions.\n• Insurance firm Lloyd's of London does not charge higher premiums for Triangle routes.\n• Popular books in the 1970s promoted the Triangle's mystery.",
 stem:"The student wants to argue that the Triangle's dangerous reputation is unwarranted. Which choice best uses the notes to accomplish this goal?",
 ch:["Popular books in the 1970s made the Bermuda Triangle famous.","Given that disappearance rates match other busy regions and insurers charge no premium for Triangle routes, the area's dangerous reputation is unsupported by evidence.","The Bermuda Triangle is a heavily trafficked ocean region.","Lloyd's of London insures ships traveling through the Bermuda Triangle."],
 a:1,exp:"The argument needs the two pieces of evidence, normal disappearance rates and no insurance premium, tied to the conclusion that the reputation is unwarranted. The other options state single facts without making the argument."},
{id:"ex-12",sec:"rw",dom:"expression",diff:2,
 stem:"Early word processors stored documents on cassette tapes, retrieval from which could take minutes. ______ modern solid-state drives locate files in fractions of a millisecond.\n\nWhich choice completes the text with the most logical transition?",
 ch:["Today, by comparison,","As a consequence,","For that reason,","In the same way,"],
 a:0,exp:"The sentences compare past and present retrieval speeds, so a transition marking time shift plus comparison fits. Modern drive speed is not caused by cassette slowness, and the two speeds are opposite, not alike."},
{id:"ex-13",sec:"rw",dom:"expression",diff:2,
 passage:"Notes the student has gathered:\n• The violinist Regina Carter trained in classical technique from age four.\n• She later became a leading jazz improviser.\n• Critics note her classical bowing control gives her jazz solos unusual clarity.",
 stem:"The student wants to show how Carter's classical training shaped her jazz playing. Which choice best uses the notes to accomplish this goal?",
 ch:["Regina Carter began studying violin at age four.","Carter's classical bowing control, developed from age four, gives her jazz improvisations their signature clarity.","Regina Carter is a leading jazz violinist.","Carter switched from classical music to jazz."],
 a:1,exp:"Showing how the training shaped the jazz requires connecting the classical technique to its effect on her solos, which one option does explicitly. The others state biography without drawing the connection."},
{id:"ex-14",sec:"rw",dom:"expression",diff:3,
 stem:"The committee did not dispute the data. ______ its objection concerned the interpretation: the same numbers, members argued, were consistent with at least two rival hypotheses.\n\nWhich choice completes the text with the most logical transition?",
 ch:["Rather,","Furthermore,","As a result,","Likewise,"],
 a:0,exp:"The first sentence rules something out and the second supplies the correction, a substitution relationship that 'Rather' expresses. The objection is not an addition to disputing the data, a consequence of it, or a parallel to it."},
{id:"ex-15",sec:"rw",dom:"expression",diff:3,
 passage:"Notes the student has gathered:\n• Wind farms kill an estimated 234,000 birds annually in the US.\n• Building collisions kill up to 1 billion birds annually.\n• Domestic cats kill an estimated 2.4 billion birds annually.\n• Critics frequently cite bird deaths as an argument against wind power.",
 stem:"The student wants to counter the critics by placing wind farm bird deaths in context. Which choice best uses the notes to accomplish this goal?",
 ch:["Wind farms kill an estimated 234,000 birds each year in the US.","Although critics cite bird deaths to oppose wind power, wind farms cause a small fraction of the toll from buildings (up to 1 billion) and cats (2.4 billion).","Domestic cats kill about 2.4 billion birds each year.","Bird deaths are frequently cited as an argument against wind power."],
 a:1,exp:"Countering the critics requires acknowledging their argument and then juxtaposing the wind figure against the far larger tolls, which one option does. The others give an isolated statistic or restate the criticism without responding."},
{id:"ex-16",sec:"rw",dom:"expression",diff:3,
 stem:"No single factor explains the collapse of the Bronze Age cities. Drought weakened harvests; earthquakes damaged infrastructure; trade routes failed; invaders exploited the disorder. ______ the civilization's interdependence turned each local crisis into a systemic one.\n\nWhich choice completes the text with the most logical transition?",
 ch:["In short,","Nevertheless,","For example,","In the meantime,"],
 a:0,exp:"The final sentence compresses the list of causes into one summary insight about interdependence, which 'In short' signals. It is a distillation of what precedes, not a contrast, example, or simultaneous event."},
{id:"ex-17",sec:"rw",dom:"expression",diff:3,
 passage:"Notes the student has gathered:\n• Katherine Johnson calculated trajectories for the 1961 Freedom 7 mission by hand.\n• John Glenn requested that Johnson personally verify the computer's numbers before his 1962 orbital flight.\n• Electronic computers were new and astronauts distrusted them.\n• Johnson's calculations matched the computer's output.",
 stem:"The student wants to convey how much trust Johnson's skill commanded. Which choice best uses the notes to accomplish this goal?",
 ch:["Johnson calculated the Freedom 7 trajectory by hand in 1961.","Electronic computers were new in the early 1960s.","So trusted was Johnson that John Glenn refused to fly until she personally confirmed the computer's numbers.","Johnson's calculations matched the computer's output."],
 a:2,exp:"Glenn's insistence that Johnson verify the machine dramatizes the trust her skill commanded, which is the stated goal. The other options give background facts without conveying trust placed in her."},
{id:"ex-18",sec:"rw",dom:"expression",diff:3,
 stem:"The restoration team faced a paradox. Cleaning the fresco would reveal the artist's original colors; ______ every cleaning method available risked removing the artist's own final retouches, which sat atop the grime.\n\nWhich choice completes the text with the most logical transition?",
 ch:["at the same time,","as a result,","in other words,","for instance,"],
 a:0,exp:"The two facts stand in tension simultaneously, benefit and risk together, which 'at the same time' captures and which constitutes the stated paradox. The risk is not caused by the reveal, a restatement of it, or an example."},
{id:"ex-19",sec:"rw",dom:"expression",diff:3,
 passage:"Notes the student has gathered:\n• A 2019 study tracked 2,000 adults for ten years.\n• Participants who gardened at least twice weekly reported 36% lower stress.\n• The study was observational, not experimental.\n• The authors caution that people with lower stress may simply be more likely to garden.",
 stem:"The student wants to accurately summarize the study's finding without overstating it. Which choice best accomplishes this goal?",
 ch:["The study proved that gardening reduces stress by 36%.","Gardening twice weekly was associated with lower reported stress, though the study's observational design leaves open whether gardening causes the difference.","People who garden are 36% healthier than people who do not.","The study found no connection between gardening and stress."],
 a:1,exp:"An accurate, non-overstated summary reports the association and preserves the authors' causal caution. 'Proved' overstates an observational result, 'healthier' distorts the measured outcome, and denying any connection contradicts the finding."},
/* ---- STANDARD ENGLISH CONVENTIONS (19) ---- */
{id:"co-01",sec:"rw",dom:"conventions",diff:1,
 stem:"The collection of rare manuscripts ______ housed in a climate-controlled vault beneath the library.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["are","is","were","have been"],
 a:1,exp:"The subject is 'collection,' a singular noun; 'of rare manuscripts' is a prepositional phrase that does not change the number. A singular subject takes 'is.'"},
{id:"co-02",sec:"rw",dom:"conventions",diff:1,
 stem:"Marie Curie, ______ research on radioactivity earned two Nobel Prizes, conducted much of her work in a converted shed.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["who's","whose","which","who"],
 a:1,exp:"The blank shows possession, the research belonging to Curie, so the possessive relative pronoun 'whose' is required. 'Who's' is a contraction of 'who is.'"},
{id:"co-03",sec:"rw",dom:"conventions",diff:1,
 stem:"By the time the rescue team arrived, the hikers ______ for shelter on their own.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["search","had searched","searches","will search"],
 a:1,exp:"The searching happened before the team's arrival, a completed past event prior to another past event, which requires the past perfect 'had searched.'"},
{id:"co-04",sec:"rw",dom:"conventions",diff:1,
 stem:"Each of the telescope's mirrors ______ polished to within a millionth of a millimeter.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["were","was","are","have been"],
 a:1,exp:"'Each' is the subject and is always singular; 'of the telescope's mirrors' does not change that. The singular past form 'was' agrees."},
{id:"co-05",sec:"rw",dom:"conventions",diff:1,
 stem:"The chef added saffron to the broth ______ gave the dish its golden color.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["it",", which","this",", it"],
 a:1,exp:"A relative clause beginning with 'which,' set off by a comma, correctly attaches the description to the sentence. The versions with 'it' or 'this' create either a run-on or a comma splice."},
{id:"co-06",sec:"rw",dom:"conventions",diff:1,
 stem:"After months of rehearsal, the dancers performed ______ opening number flawlessly.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["they're","their","there","theirs"],
 a:1,exp:"The blank needs a possessive adjective modifying 'opening number,' which is 'their.' 'They're' means 'they are,' 'there' indicates place, and 'theirs' cannot precede a noun."},
{id:"co-07",sec:"rw",dom:"conventions",diff:2,
 stem:"The experiment failed the first time ______ the team refined their method and tried again.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["time, the","time; the","time the","time; because the"],
 a:1,exp:"'The experiment failed the first time' and 'the team refined their method and tried again' are both independent clauses, and a semicolon correctly joins them. A comma alone creates a splice, no punctuation creates a run-on, and adding 'because' after the semicolon leaves a subordinate clause stranded."},
{id:"co-08",sec:"rw",dom:"conventions",diff:2,
 stem:"Neither the coach nor the players ______ willing to comment after the match.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["was","were","is","has been"],
 a:1,exp:"With 'neither...nor,' the verb agrees with the nearer subject, 'the players,' which is plural, so 'were' is correct."},
{id:"co-09",sec:"rw",dom:"conventions",diff:2,
 stem:"The award recognizes scientists ______ work has transformed public health.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["their","whose","which","who their"],
 a:1,exp:"A possessive relative pronoun must link 'scientists' to 'work': 'whose work.' 'Their' cannot introduce a relative clause, 'which' does not show possession, and 'who their' doubles the pronoun."},
{id:"co-10",sec:"rw",dom:"conventions",diff:2,
 stem:"Discovered in a Cairo archive in 1896, ______\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["scholars have studied the manuscript for over a century.","the manuscript has been studied by scholars for over a century.","studying the manuscript has occupied scholars for a century.","over a century of study has been devoted to the manuscript."],
 a:1,exp:"The opening modifier 'Discovered in a Cairo archive' must describe the noun that follows the comma, and only 'the manuscript' was discovered. The other options make scholars, studying, or a century the thing discovered, a dangling modifier."},
{id:"co-11",sec:"rw",dom:"conventions",diff:2,
 stem:"The orchestra's program included three works: a symphony by Price ______ a concerto by Coleridge-Taylor; and a suite by Still.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:[";",",","; and","(no punctuation)"],
 a:0,exp:"The list already uses semicolons between items, as 'and a suite by Still' shows, so the blank needs a semicolon to match. A comma would mix separators, and adding 'and' mid-list or omitting punctuation breaks the series."},
{id:"co-12",sec:"rw",dom:"conventions",diff:2,
 stem:"Running the city's marathon for the tenth time, ______ personal record by nearly four minutes.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["Amara's finish broke her","Amara broke her","the race saw Amara break her","it was Amara who broke her"],
 a:1,exp:"The opening modifier describes the person running, so 'Amara' must directly follow the comma. In the other versions, the finish, the race, or 'it' is absurdly described as running the marathon."},
{id:"co-13",sec:"rw",dom:"conventions",diff:2,
 stem:"The committee will award the grant to ______ submits the strongest proposal for community impact.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["whoever","whomever","who","whom"],
 a:0,exp:"The pronoun is the subject of the verb 'submits' within its own clause, so the subject form 'whoever' is correct; the entire clause, not the pronoun alone, is the object of 'to.' 'Whomever' and 'whom' are object forms, and 'who' cannot head this noun clause."},
{id:"co-14",sec:"rw",dom:"conventions",diff:3,
 stem:"The data from the twin studies ______ a strong genetic component, but environmental factors clearly modulate its expression.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["suggests","suggest","is suggesting","has suggested"],
 a:1,exp:"In formal usage 'data' is plural, taking 'suggest'; the singular pronoun 'its' later refers to 'component,' not to 'data.' The other forms treat data as singular."},
{id:"co-15",sec:"rw",dom:"conventions",diff:3,
 stem:"So rapid ______ that cartographers could not keep their maps of the coastline current.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["the erosion was","was the erosion","the erosion","erosion, it was"],
 a:1,exp:"When a sentence opens with 'So + adjective,' subject and verb invert: 'So rapid was the erosion that...' The uninverted forms leave the 'so...that' construction ungrammatical."},
{id:"co-16",sec:"rw",dom:"conventions",diff:3,
 stem:"The senator, along with three aides and a press secretary, ______ expected at the hearing tomorrow.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["are","is","were","have been"],
 a:1,exp:"'Along with' introduces a parenthetical phrase that does not change the subject's number; the subject remains 'the senator,' singular, taking 'is.'"},
{id:"co-17",sec:"rw",dom:"conventions",diff:3,
 stem:"Had the storm shifted east, the damage ______ far worse.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["would have been","will be","was","would of been"],
 a:0,exp:"'Had the storm shifted' is an inverted past conditional, which pairs with 'would have been' in the main clause. 'Would of' is a misspelling of 'would have,' and the simple tenses break the hypothetical."},
{id:"co-18",sec:"rw",dom:"conventions",diff:3,
 stem:"The manuscript's marginalia, written in at least three hands and spanning two centuries, ______ scholars a rare record of how successive readers responded to the text.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["offers","offer","is offering","has offered"],
 a:1,exp:"The subject is 'marginalia,' a plural noun; the long participial phrase between commas does not alter agreement. The plural verb 'offer' is required."},
{id:"co-19",sec:"rw",dom:"conventions",diff:3,
 stem:"Between the two finalists, the judges found it difficult to decide ______ argument was more compelling.\n\nWhich choice conforms to the conventions of Standard English?",
 ch:["who's","whose","whom","which of them"],
 a:1,exp:"Possession of 'argument' requires 'whose.' 'Who's' means 'who is,' 'whom' is an object pronoun that cannot modify a noun, and 'which of them argument' is ungrammatical."},
/* ---- ALGEBRA (19) ---- */
{id:"al-01",sec:"math",dom:"algebra",diff:1,
 stem:"If 3x − 7 = 11, what is the value of x?",
 ch:["4","6","18","54"],
 a:1,exp:"Add 7 to both sides: 3x = 18. Divide by 3: x = 6. Check: 3(6) − 7 = 18 − 7 = 11."},
{id:"al-02",sec:"math",dom:"algebra",diff:1,
 stem:"A line passes through the points (0, 4) and (2, 10). What is the slope of the line?",
 ch:["2","3","6","1/3"],
 a:1,exp:"Slope = (change in y)/(change in x) = (10 − 4)/(2 − 0) = 6/2 = 3."},
{id:"al-03",sec:"math",dom:"algebra",diff:1,
 stem:"A taxi charges a $3 base fare plus $2 for each mile traveled. Which equation gives the total cost y for a ride of m miles?",
 ch:["y = 2 + 3m","y = 3 + 2m","y = 5m","y = 6m"],
 a:1,exp:"The fixed base fare is 3, and the per-mile cost is 2 times the miles, or 2m. Total: y = 3 + 2m."},
{id:"al-04",sec:"math",dom:"algebra",diff:1,
 stem:"If 2x + 5 ≤ 17, what is the greatest possible integer value of x?",
 ch:["5","6","7","12"],
 a:1,exp:"Subtract 5: 2x ≤ 12. Divide by 2: x ≤ 6. The greatest integer satisfying this is 6."},
{id:"al-05",sec:"math",dom:"algebra",diff:1,
 stem:"What is the y-intercept of the line y = −4x + 9?",
 ch:["(0, −4)","(0, 9)","(9, 0)","(−4, 0)"],
 a:1,exp:"In slope-intercept form y = mx + b, the y-intercept is b = 9, at the point (0, 9). The value −4 is the slope."},
{id:"al-06",sec:"math",dom:"algebra",diff:1,
 stem:"If x/5 = 7, what is the value of x?",
 ch:["1.4","35","12","2/35"],
 a:1,exp:"Multiply both sides by 5: x = 35. Check: 35/5 = 7."},
{id:"al-07",sec:"math",dom:"algebra",diff:2,
 stem:"Solve the system: y = 2x + 1 and y = −x + 7. What is the value of x?",
 ch:["1","2","3","6"],
 a:1,exp:"Set the expressions equal: 2x + 1 = −x + 7. Add x to both sides: 3x + 1 = 7, so 3x = 6 and x = 2. Then y = 5 in both equations, confirming the solution."},
{id:"al-08",sec:"math",dom:"algebra",diff:2,
 stem:"If 5(x − 3) = 2x + 9, what is the value of x?",
 ch:["2","8","4","−2"],
 a:1,exp:"Expand: 5x − 15 = 2x + 9. Subtract 2x: 3x − 15 = 9. Add 15: 3x = 24, so x = 8. Check: 5(5) = 25 and 16 + 9 = 25."},
{id:"al-09",sec:"math",dom:"algebra",diff:2,
 stem:"A gym charges a one-time $40 joining fee plus $25 per month. Which inequality shows the number of months m for which total cost stays at most $290?",
 ch:["25 + 40m ≤ 290","40 + 25m ≤ 290","40 + 25m ≥ 290","65m ≤ 290"],
 a:1,exp:"Total cost is the $40 fee plus $25 times m months: 40 + 25m. 'At most $290' means less than or equal: 40 + 25m ≤ 290 (which gives m ≤ 10)."},
{id:"al-10",sec:"math",dom:"algebra",diff:2,
 stem:"The line through (1, 5) and (3, 13) has equation y = mx + b. What is the value of b?",
 ch:["4","1","5","8"],
 a:1,exp:"Slope m = (13 − 5)/(3 − 1) = 8/2 = 4. Using (1, 5): 5 = 4(1) + b, so b = 1."},
{id:"al-11",sec:"math",dom:"algebra",diff:2,
 stem:"If 3(2x − 4) − 2(x + 1) = 10, what is the value of x?",
 ch:["4","6","2","−6"],
 a:1,exp:"Expand: 6x − 12 − 2x − 2 = 10, so 4x − 14 = 10. Add 14: 4x = 24, so x = 6."},
{id:"al-12",sec:"math",dom:"algebra",diff:2,
 stem:"A phone plan costs $30 per month plus $0.10 per gigabyte over the data cap. Last month the bill was $34.50. How many gigabytes over the cap were used?",
 ch:["4.5","45","345","15"],
 a:1,exp:"The overage charge was 34.50 − 30 = $4.50. At $0.10 per GB, that is 4.50/0.10 = 45 GB."},
{id:"al-13",sec:"math",dom:"algebra",diff:2,
 stem:"For what value of k does the system y = 3x + 2 and y = kx + 5 have no solution?",
 ch:["k = 5","k = 3","k = 2","k = −3"],
 a:1,exp:"A system of two lines has no solution when the lines are parallel: same slope, different intercepts. The slopes match when k = 3, and the intercepts 2 and 5 differ, so the lines never meet."},
{id:"al-14",sec:"math",dom:"algebra",diff:3,
 stem:"If 2x + 3y = 18 and x − y = 4, what is the value of x + y?",
 ch:["8","10","6","2"],
 a:0,exp:"From x − y = 4, x = y + 4. Substitute: 2(y + 4) + 3y = 18, so 5y + 8 = 18, giving y = 2 and x = 6. Then x + y = 8."},
{id:"al-15",sec:"math",dom:"algebra",diff:3,
 stem:"The line ax + 2y = 10 is perpendicular to y = (1/3)x + 1. What is the value of a?",
 ch:["6","−6","3","−2/3"],
 a:0,exp:"Rewrite: 2y = −ax + 10, so slope = −a/2. Perpendicular to slope 1/3 means slope must be −3. Set −a/2 = −3, so a = 6."},
{id:"al-16",sec:"math",dom:"algebra",diff:3,
 stem:"A charity sells adult tickets for $12 and child tickets for $7. It sells 60 tickets total for $570. How many adult tickets were sold?",
 ch:["30","24","36","42"],
 a:0,exp:"Let a = adult tickets; children = 60 − a. Then 12a + 7(60 − a) = 570, so 12a + 420 − 7a = 570, giving 5a = 150 and a = 30. Check: 30(12) + 30(7) = 360 + 210 = 570."},
{id:"al-17",sec:"math",dom:"algebra",diff:3,
 stem:"If f(x) = 5x − 3 and f(2k) = 27, what is the value of k?",
 ch:["3","6","2","15"],
 a:0,exp:"f(2k) = 5(2k) − 3 = 10k − 3 = 27. Add 3: 10k = 30, so k = 3."},
{id:"al-18",sec:"math",dom:"algebra",diff:3,
 stem:"The solution set of |2x − 6| < 4 is which of the following?",
 ch:["1 < x < 5","x < 5","x < 1 or x > 5","−5 < x < −1"],
 a:0,exp:"|2x − 6| < 4 means −4 < 2x − 6 < 4. Add 6 throughout: 2 < 2x < 10. Divide by 2: 1 < x < 5."},
{id:"al-19",sec:"math",dom:"algebra",diff:3,
 stem:"A system of equations is y = 2x + b and 4x − 2y = 6. For what value of b does the system have infinitely many solutions?",
 ch:["−3","3","6","0"],
 a:0,exp:"Rewrite the second equation: −2y = −4x + 6, so y = 2x − 3. Infinitely many solutions require identical lines, so b = −3."},
/* ---- ADVANCED MATH (19) ---- */
{id:"ad-01",sec:"math",dom:"advanced",diff:1,
 stem:"What are the solutions to x² − 5x + 6 = 0?",
 ch:["x = 2 and x = 3","x = −2 and x = −3","x = 1 and x = 6","x = 5 and x = 6"],
 a:0,exp:"Factor: (x − 2)(x − 3) = 0, so x = 2 or x = 3. Check: 2 and 3 add to 5 and multiply to 6."},
{id:"ad-02",sec:"math",dom:"advanced",diff:1,
 stem:"If f(x) = 2x² − 3, what is the value of f(4)?",
 ch:["13","29","32","61"],
 a:1,exp:"f(4) = 2(4²) − 3 = 2(16) − 3 = 32 − 3 = 29."},
{id:"ad-03",sec:"math",dom:"advanced",diff:1,
 stem:"A colony of bacteria starts at 500 and doubles every hour. Which expression gives the population after t hours?",
 ch:["500 + 2t","500 · 2^t","500 · t²","2 · 500^t"],
 a:1,exp:"Doubling each hour is exponential growth with base 2: population = 500 · 2^t. Adding 2t would model linear growth."},
{id:"ad-04",sec:"math",dom:"advanced",diff:1,
 stem:"Which expression is equivalent to (x³)(x⁵)?",
 ch:["x⁸","x¹⁵","2x⁸","x²"],
 a:0,exp:"Multiplying powers with the same base adds the exponents: x³ · x⁵ = x^(3+5) = x⁸."},
{id:"ad-05",sec:"math",dom:"advanced",diff:1,
 stem:"What is the vertex of the parabola y = (x − 3)² + 2?",
 ch:["(3, 2)","(−3, 2)","(3, −2)","(2, 3)"],
 a:0,exp:"Vertex form is y = (x − h)² + k with vertex (h, k). Here h = 3 and k = 2, so the vertex is (3, 2)."},
{id:"ad-06",sec:"math",dom:"advanced",diff:1,
 stem:"If g(x) = x² + 1, what is g(−3)?",
 ch:["10","−8","−10","7"],
 a:0,exp:"g(−3) = (−3)² + 1 = 9 + 1 = 10. Squaring a negative gives a positive."},
{id:"ad-07",sec:"math",dom:"advanced",diff:2,
 stem:"The height of a ball, in feet, after t seconds is h(t) = −16t² + 64t. At what time does the ball reach its maximum height?",
 ch:["1 second","2 seconds","4 seconds","64 seconds"],
 a:1,exp:"A parabola's maximum is at t = −b/(2a) = −64/(2 · −16) = 64/32 = 2 seconds. The maximum height there is h(2) = 64 feet."},
{id:"ad-08",sec:"math",dom:"advanced",diff:2,
 stem:"Which expression is equivalent to x² − 9?",
 ch:["(x − 3)²","(x + 3)(x − 3)","(x + 9)(x − 1)","(x − 9)(x + 1)"],
 a:1,exp:"x² − 9 is a difference of squares: x² − 3² = (x + 3)(x − 3). Note that (x − 3)² = x² − 6x + 9, which is different."},
{id:"ad-09",sec:"math",dom:"advanced",diff:2,
 stem:"If 3^(x+1) = 81, what is the value of x?",
 ch:["3","4","26","27"],
 a:0,exp:"81 = 3⁴, so x + 1 = 4 and x = 3."},
{id:"ad-10",sec:"math",dom:"advanced",diff:2,
 stem:"A car bought for $24,000 loses 15% of its value each year. Which expression gives its value after t years?",
 ch:["24000(0.85)^t","24000(1.15)^t","24000 − 0.15t","24000(0.15)^t"],
 a:0,exp:"Losing 15% yearly means keeping 85%, so multiply by 0.85 each year: 24000(0.85)^t. The base 1.15 would model growth, and subtracting 0.15t is linear."},
{id:"ad-11",sec:"math",dom:"advanced",diff:2,
 stem:"What is the sum of the solutions of x² − 8x + 12 = 0?",
 ch:["8","12","−8","6"],
 a:0,exp:"Factor: (x − 2)(x − 6) = 0, so the solutions are 2 and 6, which sum to 8. (For any x² + bx + c = 0, the solutions sum to −b.)"},
{id:"ad-12",sec:"math",dom:"advanced",diff:2,
 stem:"If f(x) = x² − 4x + 7, what is the minimum value of f?",
 ch:["3","7","2","−4"],
 a:0,exp:"The minimum is at x = −b/(2a) = 4/2 = 2. Then f(2) = 4 − 8 + 7 = 3."},
{id:"ad-13",sec:"math",dom:"advanced",diff:2,
 stem:"Which expression is equivalent to √(50x⁴) for x > 0?",
 ch:["5x²√2","25x²","5x√2","2x²√5"],
 a:0,exp:"√50 = √(25 · 2) = 5√2 and √(x⁴) = x². Together: 5x²√2."},
{id:"ad-14",sec:"math",dom:"advanced",diff:3,
 stem:"The equation x² + 6x + c = 0 has exactly one real solution. What is the value of c?",
 ch:["9","−9","6","36"],
 a:0,exp:"One real solution requires the discriminant b² − 4ac = 0: 36 − 4c = 0, so c = 9. The equation becomes (x + 3)² = 0."},
{id:"ad-15",sec:"math",dom:"advanced",diff:3,
 stem:"If f(x) = 2x + 1 and g(x) = x², what is f(g(3))?",
 ch:["19","49","15","81"],
 a:0,exp:"Work inside out: g(3) = 9, then f(9) = 2(9) + 1 = 19. Note that g(f(3)) = g(7) = 49 is the reverse order."},
{id:"ad-16",sec:"math",dom:"advanced",diff:3,
 stem:"The function p(t) = 300(1.04)^t models a population t years from now. By what percent does the population grow over any 2-year span?",
 ch:["8.16%","8%","4%","104%"],
 a:0,exp:"Over 2 years the multiplier is (1.04)² = 1.0816, an 8.16% increase. Simply doubling 4% to 8% ignores compounding."},
{id:"ad-17",sec:"math",dom:"advanced",diff:3,
 stem:"If (x + y)² = 49 and xy = 10, what is the value of x² + y²?",
 ch:["29","39","49","59"],
 a:0,exp:"Expand: (x + y)² = x² + 2xy + y² = 49. Substitute 2xy = 20: x² + y² = 49 − 20 = 29."},
{id:"ad-18",sec:"math",dom:"advanced",diff:3,
 stem:"The graph of y = x² − 4x + 3 crosses the x-axis at which points?",
 ch:["(1, 0) and (3, 0)","(−1, 0) and (−3, 0)","(0, 1) and (0, 3)","(0, 3) only"],
 a:0,exp:"Set y = 0: x² − 4x + 3 = (x − 1)(x − 3) = 0, so x = 1 or x = 3. The crossings are (1, 0) and (3, 0); the point (0, 3) is the y-intercept."},
{id:"ad-19",sec:"math",dom:"advanced",diff:3,
 stem:"Which equation, when graphed with y = x + 3, produces a system with exactly two solutions?",
 ch:["y = x² − 1","y = x + 5","y = x − 3","y = x + 3"],
 a:0,exp:"A line can cross a parabola twice: solving x² − 1 = x + 3 gives x² − x − 4 = 0, whose discriminant 1 + 16 = 17 is positive, so two intersections. Parallel lines give zero solutions and the identical line gives infinitely many."},
/* ---- PROBLEM-SOLVING & DATA ANALYSIS (19) ---- */
{id:"da-01",sec:"math",dom:"data",diff:1,
 stem:"A jacket originally priced at $80 is on sale for 25% off. What is the sale price?",
 ch:["$55","$60","$20","$75"],
 a:1,exp:"25% of 80 is 20, so the sale price is 80 − 20 = $60. (Equivalently, 80 × 0.75 = 60.)"},
{id:"da-02",sec:"math",dom:"data",diff:1,
 stem:"A recipe uses 3 cups of flour for every 2 cups of sugar. If a baker uses 12 cups of flour, how many cups of sugar are needed?",
 ch:["6","8","18","24"],
 a:1,exp:"Set up the proportion 3/2 = 12/x. Cross-multiply: 3x = 24, so x = 8 cups of sugar."},
{id:"da-03",sec:"math",dom:"data",diff:1,
 stem:"The four values 4, 8, 10, and x have a mean of 7. What is the value of x?",
 ch:["5","6","7","28"],
 a:1,exp:"A mean of 7 over 4 values means the total is 28. Since 4 + 8 + 10 = 22, x = 28 − 22 = 6."},
{id:"da-04",sec:"math",dom:"data",diff:1,
 stem:"The price of a stock rises from $50 to $65. What is the percent increase?",
 ch:["15%","30%","23%","65%"],
 a:1,exp:"The increase is 65 − 50 = 15. Percent increase = 15/50 = 0.30 = 30%. (Dividing by the new price, 15/65 ≈ 23%, is the classic error.)"},
{id:"da-05",sec:"math",dom:"data",diff:1,
 stem:"A bag contains 5 red, 3 blue, and 2 green marbles. What is the probability of drawing a blue marble at random?",
 ch:["3/10","3/7","1/3","1/5"],
 a:0,exp:"There are 10 marbles total and 3 are blue, so the probability is 3/10."},
{id:"da-06",sec:"math",dom:"data",diff:1,
 stem:"A car travels 240 miles on 8 gallons of gas. At this rate, how many miles can it travel on 11 gallons?",
 ch:["330","264","300","352"],
 a:0,exp:"The rate is 240/8 = 30 miles per gallon. Then 30 × 11 = 330 miles."},
{id:"da-07",sec:"math",dom:"data",diff:2,
 stem:"The list 3, 5, 7, 9, 11, 15 has median m. If 15 is removed, the new median is n. What is m − n?",
 ch:["1","0","2","8"],
 a:0,exp:"With six values the median is the mean of 7 and 9, so m = 8. Removing 15 leaves 3, 5, 7, 9, 11 with median n = 7. So m − n = 1."},
{id:"da-08",sec:"math",dom:"data",diff:2,
 stem:"A shirt is marked up 40% from cost, then sold at 20% off the marked price. If the cost was $50, what was the final price?",
 ch:["$56","$60","$70","$58"],
 a:0,exp:"Markup: 50 × 1.40 = 70. Discount: 70 × 0.80 = $56. The two percentages do not simply cancel to +20%."},
{id:"da-09",sec:"math",dom:"data",diff:2,
 stem:"In a survey, 320 of 800 students chose science as their favorite subject. If the school has 2,000 students, about how many would be expected to choose science?",
 ch:["800","640","320","1,000"],
 a:0,exp:"The sample proportion is 320/800 = 40%. Applying it to the school: 0.40 × 2000 = 800 students."},
{id:"da-10",sec:"math",dom:"data",diff:2,
 stem:"A solution is 15% salt. How many grams of salt are in 300 grams of the solution?",
 ch:["45","15","30","51"],
 a:0,exp:"15% of 300 = 0.15 × 300 = 45 grams of salt."},
{id:"da-11",sec:"math",dom:"data",diff:2,
 stem:"The scatterplot of a data set has line of best fit y = 2.5x + 10, where x is hours studied and y is quiz score. What does the 2.5 represent?",
 ch:["The predicted score increase for each additional hour studied","The score of a student who studied zero hours","The maximum possible score","The number of hours the average student studied"],
 a:0,exp:"The slope of a best-fit line is the predicted change in y per unit change in x: 2.5 more points per additional hour. The value 10 (the intercept) is the predicted score at zero hours."},
{id:"da-12",sec:"math",dom:"data",diff:2,
 stem:"Data set A: 10, 12, 14, 16, 18. Data set B: 2, 8, 14, 20, 26. Which statement is true?",
 ch:["Both sets have the same mean, but B has a larger standard deviation.","Both sets have the same standard deviation.","A has a larger standard deviation than B.","B has a larger mean than A."],
 a:0,exp:"Both sets are symmetric around 14, so both means are 14. B's values spread much farther from 14 (up to 12 away versus 4), so B has the larger standard deviation."},
{id:"da-13",sec:"math",dom:"data",diff:2,
 stem:"A worker earns $18 per hour plus a flat $50 weekly bonus. Last week her pay was $716. How many hours did she work?",
 ch:["37","39.8","40","35"],
 a:0,exp:"Subtract the bonus: 716 − 50 = 666. Divide by the hourly rate: 666/18 = 37 hours."},
{id:"da-14",sec:"math",dom:"data",diff:3,
 stem:"The mean score of 20 students is 78. After one more student takes the test, the mean rises to 79. What did the new student score?",
 ch:["99","79","80","95"],
 a:0,exp:"Original total: 20 × 78 = 1560. New total: 21 × 79 = 1659. The new student scored 1659 − 1560 = 99."},
{id:"da-15",sec:"math",dom:"data",diff:3,
 stem:"A population grows from 4,000 to 4,840 in two years at a constant annual percent rate. What is the annual growth rate?",
 ch:["10%","21%","10.5%","20%"],
 a:0,exp:"4840/4000 = 1.21 over two years, so the annual multiplier is √1.21 = 1.10, a 10% annual rate. (Two years at 10% compounds to 21%, not 20%.)"},
{id:"da-16",sec:"math",dom:"data",diff:3,
 stem:"In a class, 60% of students play a sport and 30% of the sport players are on the swim team. What percent of the whole class is on the swim team?",
 ch:["18%","30%","90%","50%"],
 a:0,exp:"Multiply the proportions: 0.60 × 0.30 = 0.18, so 18% of the class swims."},
{id:"da-17",sec:"math",dom:"data",diff:3,
 stem:"A jar's marbles are red or blue in ratio 3:5. After 12 red marbles are added, the ratio of red to blue becomes 3:4. How many blue marbles are in the jar?",
 ch:["80","48","60","36"],
 a:0,exp:"Let red = 3k and blue = 5k. After adding: (3k + 12)/(5k) = 3/4. Cross-multiply: 4(3k + 12) = 15k, so 12k + 48 = 15k, giving k = 16. Blue = 5k = 80. Check: red becomes 48 + 12 = 60, and 60:80 = 3:4."},
{id:"da-18",sec:"math",dom:"data",diff:3,
 stem:"A survey of 400 randomly selected voters found 52% support a measure, with a margin of error of 4%. Which conclusion is best supported?",
 ch:["Support among all voters is plausibly between 48% and 56%.","Exactly 52% of all voters support the measure.","The measure will definitely pass.","The survey proves at least half of voters support it."],
 a:0,exp:"A 4% margin around 52% gives a plausible range of 48% to 56% for the full population. The interval includes values below 50%, so passage is not guaranteed and the exact figure is not established."},
{id:"da-19",sec:"math",dom:"data",diff:3,
 stem:"Machine A fills 120 bottles per hour and machine B fills 180 per hour. Working together, how many minutes do they need to fill 200 bottles?",
 ch:["40","30","45","60"],
 a:0,exp:"Together they fill 300 bottles per hour, or 5 per minute. Then 200 ÷ 5 = 40 minutes."},
/* ---- GEOMETRY & TRIGONOMETRY (19) ---- */
{id:"ge-01",sec:"math",dom:"geo",diff:1,
 stem:"Two angles of a triangle measure 50° and 60°. What is the measure of the third angle?",
 ch:["60°","70°","80°","110°"],
 a:1,exp:"Angles of a triangle sum to 180°. Third angle = 180 − (50 + 60) = 70°."},
{id:"ge-02",sec:"math",dom:"geo",diff:1,
 stem:"A right triangle has legs of length 6 and 8. What is the length of the hypotenuse?",
 ch:["10","14","48","100"],
 a:0,exp:"By the Pythagorean theorem: c² = 6² + 8² = 36 + 64 = 100, so c = 10."},
{id:"ge-03",sec:"math",dom:"geo",diff:1,
 stem:"A circle has a radius of 5. What is its area? (Use π ≈ 3.14.)",
 ch:["31.4","78.5","25","15.7"],
 a:1,exp:"Area = πr² = 3.14 × 25 = 78.5. The value 31.4 is the circumference (2πr), a common mix-up."},
{id:"ge-04",sec:"math",dom:"geo",diff:1,
 stem:"A rectangle has length 12 and width 5. What is its perimeter?",
 ch:["60","34","17","24"],
 a:1,exp:"Perimeter = 2(length + width) = 2(12 + 5) = 34. The value 60 is the area."},
{id:"ge-05",sec:"math",dom:"geo",diff:1,
 stem:"Two parallel lines are cut by a transversal. One angle measures 65°. What is the measure of its corresponding angle on the other line?",
 ch:["65°","115°","25°","130°"],
 a:0,exp:"Corresponding angles formed by a transversal crossing parallel lines are congruent, so the angle is also 65°. (115° would be its supplementary neighbor.)"},
{id:"ge-06",sec:"math",dom:"geo",diff:1,
 stem:"In a right triangle, an angle θ has an opposite side of length 3 and a hypotenuse of length 5. What is sin θ?",
 ch:["0.6","0.8","1.67","0.75"],
 a:0,exp:"sin θ = opposite/hypotenuse = 3/5 = 0.6. (The adjacent side is 4, so cos θ = 0.8 and tan θ = 0.75.)"},
{id:"ge-07",sec:"math",dom:"geo",diff:2,
 stem:"A cylinder has radius 3 and height 10. What is its volume?",
 ch:["90π","30π","60π","300π"],
 a:0,exp:"Volume = πr²h = π × 9 × 10 = 90π."},
{id:"ge-08",sec:"math",dom:"geo",diff:2,
 stem:"Two similar triangles have corresponding sides in ratio 2:3. If the smaller triangle has area 20, what is the area of the larger?",
 ch:["45","30","60","40"],
 a:0,exp:"Areas of similar figures scale by the square of the side ratio: (3/2)² = 9/4. So 20 × 9/4 = 45."},
{id:"ge-09",sec:"math",dom:"geo",diff:2,
 stem:"The circumference of a circle is 16π. What is its area?",
 ch:["64π","16π","32π","256π"],
 a:0,exp:"From C = 2πr = 16π, r = 8. Area = πr² = 64π."},
{id:"ge-10",sec:"math",dom:"geo",diff:2,
 stem:"An isosceles triangle has two angles measuring x° each and a third angle measuring 40°. What is x?",
 ch:["70","40","100","140"],
 a:0,exp:"The angles sum to 180: 2x + 40 = 180, so 2x = 140 and x = 70."},
{id:"ge-11",sec:"math",dom:"geo",diff:2,
 stem:"In right triangle ABC, the right angle is at C, AC = 9, and BC = 12. What is tan A?",
 ch:["4/3","3/4","3/5","4/5"],
 a:0,exp:"Angle A is at vertex A, so its opposite side is BC = 12 and its adjacent side is AC = 9. tan A = 12/9 = 4/3."},
{id:"ge-12",sec:"math",dom:"geo",diff:2,
 stem:"A square and a circle have the same perimeter/circumference of 20. Which has the larger area, and what is the square's area?",
 ch:["The circle; the square's area is 25","The square; the square's area is 25","The circle; the square's area is 100","They are equal; both areas are 25"],
 a:0,exp:"Square side = 20/4 = 5, so its area is 25. The circle's radius is 20/(2π) ≈ 3.18, giving area ≈ 31.8. For equal perimeter, a circle always encloses more area."},
{id:"ge-13",sec:"math",dom:"geo",diff:2,
 stem:"A ladder leans against a wall, reaching 12 feet up with its base 5 feet from the wall. How long is the ladder?",
 ch:["13 feet","17 feet","11 feet","14 feet"],
 a:0,exp:"The wall, ground, and ladder form a right triangle: ladder² = 12² + 5² = 144 + 25 = 169, so the ladder is 13 feet."},
{id:"ge-14",sec:"math",dom:"geo",diff:3,
 stem:"A cone has radius 6 and height 9. What is its volume?",
 ch:["108π","324π","54π","162π"],
 a:0,exp:"Volume of a cone = (1/3)πr²h = (1/3)π × 36 × 9 = 108π. Forgetting the 1/3 gives the cylinder volume, 324π."},
{id:"ge-15",sec:"math",dom:"geo",diff:3,
 stem:"In a circle with radius 10, a central angle of 72° subtends an arc. What is the arc's length?",
 ch:["4π","2π","20π","7.2π"],
 a:0,exp:"Arc length = (72/360) × circumference = (1/5) × 20π = 4π."},
{id:"ge-16",sec:"math",dom:"geo",diff:3,
 stem:"If sin θ = 5/13 and θ is acute, what is cos θ?",
 ch:["12/13","5/12","13/12","8/13"],
 a:0,exp:"With opposite 5 and hypotenuse 13, the adjacent side is √(169 − 25) = 12. So cos θ = 12/13. (This is the 5-12-13 right triangle.)"},
{id:"ge-17",sec:"math",dom:"geo",diff:3,
 stem:"A sphere has volume 36π. What is its radius?",
 ch:["3","6","9","27"],
 a:0,exp:"Volume = (4/3)πr³ = 36π, so r³ = 27 and r = 3."},
{id:"ge-18",sec:"math",dom:"geo",diff:3,
 stem:"The points (1, 2) and (7, 10) are the endpoints of a circle's diameter. What is the circle's radius?",
 ch:["5","10","25","√14"],
 a:0,exp:"Diameter = √((7−1)² + (10−2)²) = √(36 + 64) = √100 = 10, so the radius is 5."},
{id:"ge-19",sec:"math",dom:"geo",diff:3,
 stem:"Angles A and B are complementary. If sin A = 0.28, what is cos B?",
 ch:["0.28","0.72","0.96","0.14"],
 a:0,exp:"Complementary angles satisfy cos B = cos(90° − A) = sin A = 0.28. This co-function identity appears regularly on the SAT."},
